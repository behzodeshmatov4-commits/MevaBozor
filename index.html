<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor - Onlayn Do'kon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Sotuvchining Telegram username va telefon raqami
      const [sellerTelegram, setSellerTelegram] = useState(() => {
        return localStorage.getItem('meva_telegram') || "SizningTelegram";
      });
      const [sellerPhone, setSellerPhone] = useState("+998 90 123-45-67");

      // Mahsulotlar (Brauzerda saqlanadi, admin paneldan qo'shsa ham o'chib ketmaydi)
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('meva_bozor_products');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          { id: 1, name: "Qizil Olma (Fuji)", price: 18000, wholesalePrice: 15000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
          { id: 2, name: "Shirin Banan", price: 24000, wholesalePrice: 21000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
          { id: 3, name: "Qora Kishmish Uzum", price: 35000, wholesalePrice: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
          { id: 4, name: "Qirollik Mango", price: 65000, wholesalePrice: 58000, unit: "kg", image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=400" }
        ];
      });

      const [cart, setCart] = useState([]);
      const [adminView, setAdminView] = useState(false);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [deliveryFee] = useState(15000);

      // Buyurtma formasi
      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("");
      const [clientAddress, setClientAddress] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("Naqd pul (Kuryerga)");

      // Admin panel uchun yangi mahsulot kiritish
      const [newName, setNewName] = useState("");
      const [newPrice, setNewPrice] = useState("");
      const [newWholesale, setNewWholesale] = useState("");
      const [newImage, setNewImage] = useState("");

      useEffect(() => {
        localStorage.setItem('meva_bozor_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('meva_telegram', sellerTelegram);
      }, [sellerTelegram]);

      const addToCart = (product) => {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
          setCart(cart.map(item => item.id === product.id ? {...item, qty: item.qty + 1} : item));
        } else {
          setCart([...cart, {...product, qty: 1}]);
        }
      };

      const updateQty = (id, delta) => {
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? {...item, qty: newQty} : null;
          }
          return item;
        }).filter(Boolean));
      };

      const calculateTotal = () => {
        return cart.reduce((sum, item) => {
          const activePrice = item.qty >= 5 ? item.wholesalePrice : item.price;
          return sum + (activePrice * item.qty);
        }, 0);
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newName || !newPrice) {
          alert("Meva nomi va narxini kiriting!");
          return;
        }

        const newProd = {
          id: Date.now(),
          name: newName,
          price: Number(newPrice),
          wholesalePrice: newWholesale ? Number(newWholesale) : Number(newPrice) - 3000,
          unit: "kg",
          image: newImage.trim() !== "" ? newImage : "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?w=400"
        };

        setProducts([newProd, ...products]);
        setNewName("");
        setNewPrice("");
        setNewWholesale("");
        setNewImage("");
        alert("Yangi mahsulot muvaffaqiyatli qo'shildi!");
      };

      const handleDeleteProduct = (id) => {
        if (confirm("Haqiqatan ham o'chirmoqchimisiz?")) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const submitOrder = (e) => {
        e.preventDefault();
        if (!clientName || !clientPhone || !clientAddress) {
          alert("Barcha maydonlarni to'ldiring!");
          return;
        }

        let orderText = "🛒 *YANGI BUYURTMA - MevaBozor*\n\n";
        orderText += "👤 *Mijoz:* " + clientName + "\n";
        orderText += "📞 *Tel:* " + clientPhone + "\n";
        orderText += "📍 *Manzil:* " + clientAddress + "\n";
        orderText += "💳 *To'lov turi:* " + paymentMethod + "\n\n";
        orderText += "📦 *Buyurtmalar:* \n";

        cart.forEach((item, index) => {
          const price = item.qty >= 5 ? item.wholesalePrice : item.price;
          const optomTag = item.qty >= 5 ? " (Optom 🔥)" : "";
          orderText += (index + 1) + ". " + item.name + " - " + item.qty + " " + item.unit + " x " + price.toLocaleString() + " so'm" + optomTag + "\n";
        });

        const goodsTotal = calculateTotal();
        orderText += "\n🚚 *Yetkazish:* " + deliveryFee.toLocaleString() + " so'm\n";
        orderText += "💰 *JAMI TO'LOV:* " + (goodsTotal + deliveryFee).toLocaleString() + " so'm";

        const cleanUsername = sellerTelegram.replace('@', '').trim();
        const telegramUrl = "https://t.me/" + cleanUsername + "?text=" + encodeURIComponent(orderText);
        window.open(telegramUrl, '_blank');
      };

      const goodsTotal = calculateTotal();
      const grandTotal = goodsTotal > 0 ? goodsTotal + deliveryFee : 0;
      const totalItems = cart.reduce((a, c) => a + c.qty, 0);

      return (
        <div className="min-h-screen pb-24">
          {/* Header */}
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center max-w-md mx-auto">
            <h1 className="text-base font-bold">🍎 MevaBozor</h1>
            <div className="flex gap-2">
              <button 
                onClick={() => setAdminView(!adminView)} 
                className="bg-emerald-700 text-[11px] px-2.5 py-1.5 rounded-lg border border-emerald-500 font-semibold"
              >
                {adminView ? "🛒 Do'kon" : "⚙️ Admin"}
              </button>
              <button 
                onClick={() => setIsCartOpen(true)}
                className="bg-emerald-700 text-[11px] px-2.5 py-1.5 rounded-lg border border-emerald-500 font-semibold"
              >
                🛒 ({totalItems})
              </button>
            </div>
          </header>

          <main className="max-w-md mx-auto p-4">
            {adminView ? (
              // Sotuvchi (Admin) paneli
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-xl shadow border">
                  <h2 className="text-sm font-bold mb-2 text-emerald-800">⚙️ Sotuvchi Sozlamalari</h2>
                  <label className="text-[11px] text-gray-500 font-bold">Sizning Telegram Username'ingiz:</label>
                  <input 
                    type="text" 
                    value={sellerTelegram} 
                    onChange={(e) => setSellerTelegram(e.target.value)}
                    className="w-full border p-2 rounded-lg text-xs mt-1"
                    placeholder="Masalan: Alisher_Meva (@ siz)"
                  />
                  <p className="text-[10px] text-gray-400 mt-1">Buyurtmalar shu usernamega yuboriladi.</p>
                </div>

                <div className="bg-white p-4 rounded-xl shadow border">
                  <h2 className="text-sm font-bold mb-3 text-emerald-800">➕ Yangi Meva Qo'shish</h2>
                  <form onSubmit={handleAddProduct} className="space-y-2.5 text-xs">
                    <input type="text" placeholder="Meva nomi (masalan: Shaftoli)" value={newName} onChange={(e) => setNewName(e.target.value)} className="w-full border p-2 rounded-lg" />
                    <div className="flex gap-2">
                      <input type="number" placeholder="Chakana narx (so'm)" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} className="w-full border p-2 rounded-lg" />
                      <input type="number" placeholder="Optom narx (5+ kg)" value={newWholesale} onChange={(e) => setNewWholesale(e.target.value)} className="w-full border p-2 rounded-lg" />
                    </div>
                    <input type="text" placeholder="Rasm URL havolasi (ixtiyoriy)" value={newImage} onChange={(e) => setNewImage(e.target.value)} className="w-full border p-2 rounded-lg text-xs" />
                    <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">Qo'shish</button>
                  </form>
                </div>

                <div className="bg-white p-4 rounded-xl shadow border">
                  <h2 className="text-sm font-bold mb-3 text-emerald-800">📋 Mavjud Mahsulotlar ({products.length} ta)</h2>
                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {products.map(p => (
                      <div key={p.id} className="flex justify-between items-center py-1.5 border-b text-xs">
                        <div>
                          <p className="font-bold">{p.name}</p>
                          <p className="text-emerald-600">{p.price.toLocaleString()} so'm</p>
                        </div>
                        <button onClick={() => handleDeleteProduct(p.id)} className="bg-red-100 text-red-600 px-2 py-1 rounded font-bold text-[10px]">O'chirish</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              // Xaridor ko'radigan asosiy oyna
              <div>
                {/* Banner / Aksiyalar */}
                <div className="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-4 rounded-2xl shadow-md mb-4">
                  <h2 className="font-bold text-sm mb-1">🎁 Aksiya va Bonuslar</h2>
                  <p className="text-xs opacity-90">Har qanday mevadan 5 kg va undan koʻp olsangiz — avtomatik <b>Optom chegirma</b> ishlaydi! Toshkent boʻylab tezkor yetkazish 🚚.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {products.map(p => (
                    <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                      <div>
                        <img src={p.image} alt={p.name} className="w-full h-24 object-cover rounded-lg mb-2" />
                        <h3 className="font-bold text-xs text-gray-800 h-7 overflow-hidden">{p.name}</h3>
                        <p className="text-emerald-700 font-extrabold text-xs mt-1">{p.price.toLocaleString()} so'm /{p.unit}</p>
                        <p className="text-amber-600 text-[10px] font-semibold">🔥 5+ kg: {p.wholesalePrice.toLocaleString()} so'm</p>
                      </div>
                      <button 
                        onClick={() => addToCart(p)}
                        className="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold transition"
                      >
                        + Savatga
                      </button>
                    </div>
                  ))}
                </div>

                {/* Aloqa bo'limi */}
                <div className="mt-6 bg-white p-4 rounded-xl shadow-sm border text-center text-xs space-y-1">
                  <p className="font-bold text-emerald-800">📞 Savollar bo'yicha bog'lanish:</p>
                  <p className="text-gray-600">Telefon: {sellerPhone}</p>
                  <p className="text-gray-600">Telegram: @{sellerTelegram}</p>
                </div>
              </div>
            )}
          </main>

          {/* Pastdagi Savat Paneli */}
          {totalItems > 0 && !adminView && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-2xl max-w-md mx-auto z-40 flex justify-between items-center">
              <div>
                <p className="text-xs text-gray-500">Jami ({totalItems} ta):</p>
                <p className="text-sm font-bold text-emerald-700">{grandTotal.toLocaleString()} so'm</p>
              </div>
              <button 
                onClick={() => setIsCartOpen(true)}
                className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow"
              >
                Buyurtma berish 🚀
              </button>
            </div>
          )}

          {/* Savat va Buyurtma Oynasi */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-emerald-800">🛒 Savat va To'lov</h3>
                  <button onClick={() => setIsCartOpen(false)} className="text-gray-400 font-bold">✕</button>
                </div>

                <div className="space-y-2 mb-4 border-b pb-3">
                  {cart.map(item => {
                    const price = item.qty >= 5 ? item.wholesalePrice : item.price;
                    return (
                      <div key={item.id} className="flex justify-between items-center text-xs">
                        <div className="flex-1">
                          <p className="font-bold">{item.name}</p>
                          <p className="text-gray-500">
                            {price.toLocaleString()} so'm 
                            {item.qty >= 5 && <span className="text-amber-600 font-bold"> (Optom 🔥)</span>}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateQty(item.id, -1)} className="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
                          <span className="font-bold">{item.qty} {item.unit}</span>
                          <button onClick={() => updateQty(item.id, 1)} className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <form onSubmit={submitOrder} className="space-y-2.5 text-xs">
                  <input type="text" required value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Ismingiz" className="w-full border p-2 rounded-lg" />
                  <input type="tel" required value={clientPhone} onChange={(e) => setClientPhone(e.target.value)} placeholder="Telefon raqamingiz" className="w-full border p-2 rounded-lg" />
                  <textarea required rows="2" value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} placeholder="Yetkazish manzili" className="w-full border p-2 rounded-lg"></textarea>
                  
                  <div>
                    <label className="text-[10px] text-gray-500 font-bold">To'lov turini tanlang:</label>
                    <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="w-full border p-2 rounded-lg bg-white mt-1">
                      <option value="Naqd pul (Kuryerga)">Naqd pul (Kuryerga beraman)</option>
                      <option value="Click orqali">Click orqali o'tkazaman</option>
                      <option value="Payme orqali">Payme orqali o'tkazaman</option>
                    </select>
                  </div>

                  <div className="bg-emerald-50 p-2 rounded-lg text-emerald-900 text-xs font-semibold space-y-1">
                    <div className="flex justify-between"><span>Mahsulotlar:</span><span>{goodsTotal.toLocaleString()} so'm</span></div>
                    <div className="flex justify-between"><span>Yetkazish:</span><span>{deliveryFee.toLocaleString()} so'm</span></div>
                    <div className="flex justify-between border-t pt-1 font-bold text-sm"><span>Jami:</span><span>{grandTotal.toLocaleString()} so'm</span></div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsCartOpen(false)} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl font-bold">Yopish</button>
                    <button type="submit" className="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold">Telegramga 🚀</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
