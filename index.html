<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [products] = useState([
        { id: 1, name: "Qizil Olma (Fuji)", price: 18000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 2, name: "Shirin Banan", price: 24000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
        { id: 3, name: "Qora Kishmish Uzum", price: 35000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
        { id: 4, name: "Qirollik Mango", price: 65000, unit: "kg", image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=400" }
      ]);

      const [cartCount, setCartCount] = useState(0);

      const handleOrder = (productName) => {
        alert(productName + " tanlandi! Buyurtma berish uchun telegramga o'tamiz.");
        const text = encodeURIComponent("Salom, " + productName + " buyurtma bermoqchiman.");
        window.open("https://t.me/SizningTelegram?text=" + text, "_blank");
      };

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
            <h1 className="text-lg font-bold">🍎 MevaBozor Onlayn</h1>
            <span className="bg-emerald-700 text-xs px-3 py-1.5 rounded-lg">Buyurtmalar: {cartCount}</span>
          </header>

          <main className="max-w-md mx-auto p-4">
            <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 text-xs text-emerald-800">
              🚚 Toshkent shahri bo'ylab yetkazib berish xizmati mavjud!
            </div>

            <div className="grid grid-cols-2 gap-3">
              {products.map(p => (
                <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                  <img src={p.image} alt={p.name} className="w-full h-24 object-cover rounded-lg mb-2" />
                  <div>
                    <h3 className="font-bold text-xs text-gray-800 h-7 overflow-hidden">{p.name}</h3>
                    <p className="text-emerald-700 font-extrabold text-xs mt-1">{p.price.toLocaleString()} so'm /{p.unit}</p>
                  </div>
                  <button 
                    onClick={() => { setCartCount(cartCount + 1); handleOrder(p.name); }}
                    className="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold"
                  >
                    Buyurtma berish
                  </button>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
