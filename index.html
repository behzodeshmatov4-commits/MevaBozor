<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor - Onlayn Do'kon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [cart, setCart] = useState([]);
      const [adminView, setAdminView] = useState(false);
      const [deliveryFee, setDeliveryFee] = useState(15000);
      
      const [products, setProducts] = useState([
        { id: 1, name: "Qizil Olma (Fuji)", price: 18000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 2, name: "Shirin Banan", price: 24000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
        { id: 3, name: "Qora Uzum", price: 35000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
        { id: 4, name: "Yangi Qulupnay", price: 45000, unit: "kg", image: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400" }
      ]);

      const addToCart = (product) => {
        setCart([...cart, product]);
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      return (
        <div className="min-h-screen pb-20">
          {/* Header */}
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <h1 className="text-xl font-bold flex items-center gap-2">🍎 MevaBozor</h1>
            <div className="flex gap-2">
              <button onClick={() => setAdminView(!adminView)} className="bg-emerald-700 text-xs px-3 py-1.5 rounded-lg border border-emerald-500">
                {adminView ? "🛒 Do'kon" : "⚙️ Sotuvchi paneli"}
              </button>
            </div>
          </header>

          {/* Body */}
          <main className="max-w-md mx-auto p-4">
            {adminView ? (
              <div className="bg-white p-4 rounded-xl shadow border border-gray-100">
                <h2 className="text-lg font-bold mb-4 text-emerald-800">⚙️ Sotuvchi Paneli</h2>
                <div className="mb-4">
                  <label className="block text-sm text-gray-600 mb-1">Yetkazib berish narxi (so'm):</label>
                  <input 
                    type="number" 
                    value={deliveryFee} 
                    onChange={(e) => setDeliveryFee(Number(e.target.value))}
                    className="w-full border p-2 rounded-lg text-sm"
                  />
                </div>
                <h3 className="font-semibold text-sm mb-2">Mahsulotlar narxini o'zgartirish:</h3>
                {products.map(p => (
                  <div key={p.id} className="flex justify-between items-center py-2 border-b text-sm">
                    <span>{p.name}</span>
                    <input 
                      type="number" 
                      value={p.price} 
                      onChange={(e) => {
                        const newPrice = Number(e.target.value);
                        setProducts(products.map(item => item.id === p.id ? {...item, price: newPrice} : item));
                      }}
                      className="w-24 border p-1 rounded text-right"
                    />
                  </div>
                ))}
              </div>
            ) : (
              <div>
                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 text-xs text-emerald-800 flex justify-between">
                  <span>🚚 Yetkazib berish:</span>
                  <span className="font-bold">{deliveryFee.toLocaleString()} so'm</span>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {products.map(p => (
                    <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                      <img src={p.image} alt={p.name} className="w-full h-24 object-cover rounded-lg mb-2" />
                      <div>
                        <h3 className="font-bold text-sm text-gray-800">{p.name}</h3>
                        <p className="text-emerald-600 font-extrabold text-sm">{p.price.toLocaleString()} so'm /{p.unit}</p>
                      </div>
                      <button 
                        onClick={() => addToCart(p)}
                        className="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold transition"
                      >
                        + Savatga
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Savat pastda */}
          {!adminView && cart.length > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-md mx-auto">
              <div>
                <p className="text-xs text-gray-500">Jami ({cart.length} mahsulot + yetkazish):</p>
                <p className="text-lg font-bold text-emerald-700">{(totalPrice + deliveryFee).toLocaleString()} so'm</p>
              </div>
              <button onClick={() => alert("Buyurtmangiz qabul qilindi! Tez orada aloqaga chiqamiz.")} className="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm">
                Rasmiylashtirish
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
