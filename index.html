<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor - Dunyo Mevalari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [cart, setCart] = useState([]);
      const [adminView, setAdminView] = useState(false);
      const [deliveryFee, setDeliveryFee] = useState(15000);
      
      const [products, setProducts] = useState([
        // OLMALAR (15 xil)
        { id: 1, name: "Qizil Olma (Fuji)", price: 18000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 2, name: "Qizil Olma (Gala)", price: 17000, unit: "kg", image: "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?w=400" },
        { id: 3, name: "Qizil Olma (Starkrimson)", price: 19000, unit: "kg", image: "https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400" },
        { id: 4, name: "Qizil Olma (Granny Qizil)", price: 20000, unit: "kg", image: "https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?w=400" },
        { id: 5, name: "Semerenko Olmasi (Yashil)", price: 16000, unit: "kg", image: "https://images.unsplash.com/photo-1576179646964-2e6c57f92f59?w=400" },
        { id: 6, name: "Golden Delicious (Sariq)", price: 18000, unit: "kg", image: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=400" },
        { id: 7, name: "Baxtiyor olmasi", price: 14000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 8, name: "Qandil Sinap", price: 22000, unit: "kg", image: "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?w=400" },
        { id: 9, name: "Rosa olmasi", price: 21000, unit: "kg", image: "https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400" },
        { id: 10, name: "Pechin olmasi", price: 15000, unit: "kg", image: "https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?w=400" },
        { id: 11, name: "Beshqarsaman olmasi", price: 23000, unit: "kg", image: "https://images.unsplash.com/photo-1576179646964-2e6c57f92f59?w=400" },
        { id: 12, name: "Airis red olmasi", price: 25000, unit: "kg", image: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=400" },
        { id: 13, name: "Pink Lady olmasi", price: 28000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 14, name: "Braeburn olmasi", price: 24000, unit: "kg", image: "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?w=400" },
        { id: 15, name: "Fuji Premium", price: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400" },

        // UZUMLAR (5 xil)
        { id: 16, name: "Qora Kishmish Uzum", price: 35000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
        { id: 17, name: "Husayni Uzum (Kelin barmoq)", price: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1596363505789-4e613c224ef3?w=400" },
        { id: 18, name: "Toifi Uzumi", price: 28000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
        { id: 19, name: "Raysat qora uzum", price: 32000, unit: "kg", image: "https://images.unsplash.com/photo-1596363505789-4e613c224ef3?w=400" },
        { id: 20, name: "Nimrang oq uzum", price: 27000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },

        // BANANLAR (3 xil)
        { id: 21, name: "Shirin Banan (Ekvador)", price: 24000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
        { id: 22, name: "Mini Banan", price: 38000, unit: "kg", image: "https://images.unsplash.com/photo-1528825871115-3581a5387919?w=400" },
        { id: 23, name: "Qizil Banan", price: 45000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },

        // MAHALLIY VA BOSHQA MEVALAR
        { id: 24, name: "Saraton Nok", price: 26000, unit: "kg", image: "https://images.unsplash.com/photo-1514756313117-ee9992d71c17?w=400" },
        { id: 25, name: "Limoniy Behi", price: 22000, unit: "kg", image: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=400" },
        { id: 26, name: "Sariq Shaftoli", price: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1595124134710-1117c277f804?w=400" },
        { id: 27, name: "Yangi Qulupnay", price: 45000, unit: "kg", image: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400" },
        { id: 28, name: "Shirin Tarvuz", price: 8000, unit: "dona", image: "https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=400" },
        { id: 29, name: "Asal Qovun", price: 15000, unit: "dona", image: "https://images.unsplash.com/photo-1526318896980-cf7bcea98844?w=400" },
        { id: 30, name: "Apelsin", price: 32000, unit: "kg", image: "https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=400" },

        // DUNYO / EKSOTIK MEVALARI
        { id: 31, name: "Qirollik Mango (Tailand)", price: 65000, unit: "kg", image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=400" },
        { id: 32, name: "Avakado Hass", price: 70000, unit: "kg", image: "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=400" },
        { id: 33, name: "Ananas (Tropik)", price: 40000, unit: "dona", image: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=400" },
        { id: 34, name: "Kivi (Yangi Zelandiya)", price: 45000, unit: "kg", image: "https://images.unsplash.com/photo-1585059896245-a262458ae2c7?w=400" },
        { id: 35, name: "Dragon Fruit (Pitaxaya)", price: 90000, unit: "dona", image: "https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400" },
        { id: 36, name: "Marakuya (Passion Fruit)", price: 110000, unit: "kg", image: "https://images.unsplash.com/photo-1543168259-24e5e7d363f5?w=400" },
        { id: 37, name: "Papayya", price: 85000, unit: "dona", image: "https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=400" },
        { id: 38, name: "Kokos Yong'og'i", price: 35000, unit: "dona", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400" },
        { id: 39, name: "Granat (Anor - Premium)", price: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1541459639661-8ff629c15859?w=400" },
        { id: 40, name: "Greypsfut", price: 36000, unit: "kg", image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400" }
      ]);

      const addToCart = (product) => {
        setCart([...cart, product]);
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      return (
        <div className="min-h-screen pb-24">
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <h1 className="text-xl font-bold flex items-center gap-2">🌍 Dunyo Mevalari</h1>
            <button onClick={() => setAdminView(!adminView)} className="bg-emerald-700 text-xs px-3 py-1.5 rounded-lg border border-emerald-500">
              {adminView ? "🛒 Do'kon" : "⚙️ Sotuvchi paneli"}
            </button>
          </header>

          <main className="max-w-md mx-auto p-4">
            {adminView ? (
              <div className="bg-white p-4 rounded-xl shadow border border-gray-100">
                <h2 className="text-lg font-bold mb-4 text-emerald-800">⚙️ Sotuvchi Paneli</h2>
                <div className="mb-4">
                  <label className="block text-sm text-gray-600 mb-1">Yetkazib berish narxi (so'm):</label>
                  <input 
                    type="number" 
                    value={deliveryFee} 
                    onChange={(e) => setDeliveryFee(Number(e.target.value))}
                    className="w-full border p-2 rounded-lg text-sm"
                  />
                </div>
                <h3 className="font-semibold text-sm mb-2">Barcha mevalar narxini o'zgartirish:</h3>
                {products.map(p => (
                  <div key={p.id} className="flex justify-between items-center py-2 border-b text-sm">
                    <span className="truncate w-40">{p.name}</span>
                    <input 
                      type="number" 
                      value={p.price} 
                      onChange={(e) => {
                        const newPrice = Number(e.target.value);
                        setProducts(products.map(item => item.id === p.id ? {...item, price: newPrice} : item));
                      }}
                      className="w-24 border p-1 rounded text-right"
                    />
                  </div>
                ))}
              </div>
            ) : (
              <div>
                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 text-xs text-emerald-800 flex justify-between">
                  <span>🚚 Yetkazib berish xizmati:</span>
                  <span className="font-bold">{deliveryFee.toLocaleString()} so'm</span>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {products.map(p => (
                    <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                      <img src={p.image} alt={p.name} className="w-full h-24 object-cover rounded-lg mb-2" />
                      <div>
                        <h3 className="font-bold text-xs text-gray-800 h-8 overflow-hidden">{p.name}</h3>
                        <p className="text-emerald-600 font-extrabold text-xs mt-1">{p.price.toLocaleString()} so'm /{p.unit}</p>
                      </div>
                      <button 
                        onClick={() => addToCart(p)}
                        className="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold transition"
                      >
                        + Savatga
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {!adminView && cart.length > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-md mx-auto z-50">
              <div>
                <p className="text-xs text-gray-500">Jami ({cart.length} ta):</p>
                <p className="text-base font-bold text-emerald-700">{(totalPrice + deliveryFee).toLocaleString()} so'm</p>
              </div>
              <button onClick={() => alert("Buyurtmangiz qabul qilindi! Tez orada operatorlarimiz siz bilan bog'lanishadi.")} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs">
                Rasmiylashtirish
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
