<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor - Boshqaruv Paneli bilan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Xotirada saqlangan mahsulotlar yoki boshlang'ich mevalar
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('meva_bozor_products');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          { id: 1, name: "Qizil Olma (Fuji)", price: 18000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
          { id: 2, name: "Shirin Banan", price: 24000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
          { id: 3, name: "Qora Kishmish Uzum", price: 35000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
          { id: 4, name: "Qirollik Mango", price: 65000, unit: "kg", image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=400" }
        ];
      });

      const [cart, setCart] = useState([]);
      const [adminView, setAdminView] = useState(false);
      const [deliveryFee, setDeliveryFee] = useState(15000);

      // Yangi meva qo'shish uchunformalar holati
      const [newName, setNewName] = useState("");
      const [newPrice, setNewPrice] = useState("");
      const [newUnit, setNewUnit] = useState("kg");
      const [newImage, setNewImage] = useState("");

      // Mahsulotlar o'zgarganda xotiraga saqlash
      useEffect(() => {
        localStorage.setItem('meva_bozor_products', JSON.stringify(products));
      }, [products]);

      const addToCart = (product) => {
        setCart([...cart, product]);
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      // Yangi meva qo'shish funksiyasi
      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newName || !newPrice) {
          alert("Iltimos, meva nomi va narxini kiriting!");
          return;
        }

        const defaultImages = [
          "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?w=400",
          "https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400",
          "https://images.unsplash.com/photo-1595124134710-1117c277f804?w=400"
        ];
        const randomImg = defaultImages[Math.floor(Math.random() * defaultImages.length)];

        const newProd = {
          id: Date.now(),
          name: newName,
          price: Number(newPrice),
          unit: newUnit,
          image: newImage.trim() !== "" ? newImage : randomImg
        };

        setProducts([newProd, ...products]);
        setNewName("");
        setNewPrice("");
        setNewImage("");
        alert("Yangi meva muvaffaqiyatli qo'shildi!");
      };

      // Mevani o'chirish
      const handleDeleteProduct = (id) => {
        if (confirm("Haqiqatan ham bu mevani o'chirmoqchimisiz?")) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      return (
        <div className="min-h-screen pb-24">
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <h1 className="text-xl font-bold flex items-center gap-2">🍎 MevaBozor</h1>
            <button 
              onClick={() => setAdminView(!adminView)} 
              className="bg-emerald-700 text-xs px-3 py-2 rounded-lg border border-emerald-500 font-semibold"
            >
              {adminView ? "🛒 Do'konga qaytish" : "⚙️ Sotuvchi paneli"}
            </button>
          </header>

          <main className="max-w-md mx-auto p-4">
            {adminView ? (
              <div className="space-y-6">
                {/* Yangi meva qo'shish formasi */}
                <div className="bg-white p-4 rounded-xl shadow border border-gray-100">
                  <h2 className="text-base font-bold mb-3 text-emerald-800">➕ Yangi Meva Qo'shish</h2>
                  <form onSubmit={handleAddProduct} className="space-y-3 text-sm">
                    <div>
                      <label className="block text-gray-600 text-xs mb-1">Meva nomi:</label>
                      <input 
                        type="text" 
                        placeholder="Masalan: Qulupnay" 
                        value={newName}
                        onChange={(e) => setNewName(e.target.value)}
                        className="w-full border p-2 rounded-lg"
                      />
                    </div>
                    <div className="flex gap-2">
                      <div className="flex-1">
                        <label className="block text-gray-600 text-xs mb-1">Narxi (so'm):</label>
                        <input 
                          type="number" 
                          placeholder="25000" 
                          value={newPrice}
                          onChange={(e) => setNewPrice(e.target.value)}
                          className="w-full border p-2 rounded-lg"
                        />
                      </div>
                      <div className="w-24">
                        <label className="block text-gray-600 text-xs mb-1">Birlik:</label>
                        <select 
                          value={newUnit} 
                          onChange={(e) => setNewUnit(e.target.value)}
                          className="w-full border p-2 rounded-lg bg-white"
                        >
                          <option value="kg">kg</option>
                          <option value="dona">dona</option>
                          <option value="bog'">bog'</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-gray-600 text-xs mb-1">Rasm havolasi (URL - ixtiyoriy):</label>
                      <input 
                        type="text" 
                        placeholder="https://... (bo'sh qoldirsangiz, avtomat rasm qo'yiladi)" 
                        value={newImage}
                        onChange={(e) => setNewImage(e.target.value)}
                        className="w-full border p-2 rounded-lg text-xs"
                      />
                    </div>
                    <button 
                      type="submit" 
                      className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-emerald-700 transition"
                    >
                      Mevani Qo'shish
                    </button>
                  </form>
                </div>

                {/* Yetkazib berish narxini sozlash */}
                <div className="bg-white p-4 rounded-xl shadow border border-gray-100">
                  <h2 className="text-base font-bold mb-3 text-emerald-800">🚚 Yetkazib berish narxi</h2>
                  <input 
                    type="number" 
                    value={deliveryFee} 
                    onChange={(e) => setDeliveryFee(Number(e.target.value))}
                    className="w-full border p-2 rounded-lg text-sm"
                  />
                </div>

                {/* Mavjud mevalarni boshqarish va o'chirish */}
                <div className="bg-white p-4 rounded-xl shadow border border-gray-100">
                  <h2 className="text-base font-bold mb-3 text-emerald-800">📋 Mavjud mevalar ({products.length} ta)</h2>
                  <div className="space-y-2 max-h-96 overflow-y-auto">
                    {products.map(p => (
                      <div key={p.id} className="flex justify-between items-center py-2 border-b text-sm gap-2">
                        <img src={p.image} alt={p.name} className="w-10 h-10 object-cover rounded-lg" />
                        <div className="flex-1 truncate">
                          <p className="font-semibold text-xs truncate">{p.name}</p>
                          <p className="text-emerald-600 text-xs">{p.price.toLocaleString()} so'm</p>
                        </div>
                        <button 
                          onClick={() => handleDeleteProduct(p.id)}
                          className="bg-red-50 text-red-600 px-2 py-1 rounded text-xs font-bold border border-red-200"
                        >
                          O'chirish
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div>
                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 text-xs text-emerald-800 flex justify-between items-center">
                  <span>🚚 Yetkazib berish xizmati:</span>
                  <span className="font-bold">{deliveryFee.toLocaleString()} so'm</span>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {products.map(p => (
                    <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                      <img src={p.image} alt={p.name} className="w-full h-28 object-cover rounded-lg mb-2" />
                      <div>
                        <h3 className="font-bold text-xs text-gray-800 h-8 overflow-hidden">{p.name}</h3>
                        <p className="text-emerald-600 font-extrabold text-xs mt-1">{p.price.toLocaleString()} so'm /{p.unit}</p>
                      </div>
                      <button 
                        onClick={() => addToCart(p)}
                        className="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold transition"
                      >
                        + Savatga
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {!adminView && cart.length > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-md mx-auto z-50">
              <div>
                <p className="text-xs text-gray-500">Jami ({cart.length} ta):</p>
                <p className="text-base font-bold text-emerald-700">{(totalPrice + deliveryFee).toLocaleString()} so'm</p>
              </div>
              <button 
                onClick={() => alert("Buyurtmangiz qabul qilindi! Tez orada operatorlarimiz bog'lanishadi.")} 
                className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs"
              >
                Rasmiylashtirish
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
