<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MevaBozor - Onlayn Savdo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      // Sotuvchining Telegram usernamesi (Username'ingizni shu yerga yozasiz)
      const [telegramUsername, setTelegramUsername] = useState("SizningTelegram");

      // Mevalar ro'yxati (Chakana va Optom narxi bilan)
      const [products] = useState([
        { id: 1, name: "Qizil Olma (Fuji)", price: 18000, wholesalePrice: 15000, unit: "kg", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
        { id: 2, name: "Shirin Banan", price: 24000, wholesalePrice: 21000, unit: "kg", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
        { id: 3, name: "Qora Kishmish Uzum", price: 35000, wholesalePrice: 30000, unit: "kg", image: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=400" },
        { id: 4, name: "Qirollik Mango", price: 65000, wholesalePrice: 58000, unit: "kg", image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=400" }
      ]);

      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [deliveryFee] = useState(15000);

      // Mijoz ma'lumotlari
      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("");
      const [clientAddress, setClientAddress] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("Naqd pul");

      // Savatga qo'shish
      const addToCart = (product) => {
        const exist = cart.find(item => item.id === product.id);
        if (exist) {
          setCart(cart.map(item => item.id === product.id ? { ...exist, qty: exist.qty + 1 } : item));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      // Miqdorni o'zgartirish (+ / -)
      const updateQty = (id, delta) => {
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      // Jami summani hisoblash (5 kg va undan ko'p bo'lsa optom narx ishlaydi)
      const calculateTotal = () => {
        return cart.reduce((sum, item) => {
          const currentPrice = item.qty >= 5 ? item.wholesalePrice : item.price;
          return sum + (currentPrice * item.qty);
        }, 0);
      };

      // Telegramga buyurtma yuborish
      const sendToTelegram = (e) => {
        e.preventDefault();
        if (cart.length === 0) {
          alert("Savatingiz bo'sh!");
          return;
        }

        let message = "🛒 *YANGI BUYURTMA - MevaBozor*\n\n";
        message += "👤 *Mijoz:* " + clientName + "\n";
        message += "📞 *Tel:* " + clientPhone + "\n";
        message += "📍 *Manzil:* " + clientAddress + "\n";
        message += "💳 *To'lov turi:* " + paymentMethod + "\n\n";
        message += "📦 *Mahsulotlar:* \n";

        cart.forEach((item, index) => {
          const usedPrice = item.qty >= 5 ? item.wholesalePrice : item.price;
          const isWholesale = item.qty >= 5 ? " (Optom 🔥)" : "";
          message += (index + 1) + ". " + item.name + " - " + item.qty + " " + item.unit + " x " + usedPrice.toLocaleString() + " so'm" + isWholesale + "\n";
        });

        const goodsTotal = calculateTotal();
        message += "\n🚚 *Yetkazib berish:* " + deliveryFee.toLocaleString() + " so'm\n";
        message += "💰 *JAMI TO'LOV:* " + (goodsTotal + deliveryFee).toLocaleString() + " so'm";

        const cleanUsername = telegramUsername.replace("@", "").trim();
        const url = "https://t.me/" + cleanUsername + "?text=" + encodeURIComponent(message);
        window.open(url, "_blank");
      };

      const goodsTotal = calculateTotal();
      const grandTotal = goodsTotal > 0 ? goodsTotal + deliveryFee : 0;
      const totalItemsCount = cart.reduce((sum, item) => sum + item.qty, 0);

      return (
        <div className="min-h-screen pb-24">
          {/* Header */}
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center max-w-md mx-auto">
            <h1 className="text-lg font-bold">🍎 MevaBozor</h1>
            <button 
              onClick={() => setIsCartOpen(true)}
              className="bg-emerald-700 text-xs px-3 py-2 rounded-lg border border-emerald-500 font-semibold flex items-center gap-1"
            >
              🛒 Savat ({totalItemsCount})
            </button>
          </header>

          <main className="max-w-md mx-auto p-4">
            <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 text-xs text-emerald-800">
              🔥 <b>Optom chegirma:</b> Har qanday mevadan 5 kg va undan ko'p olsangiz, optom narxda hisoblanadi!
            </div>

            {/* Mahsulotlar Ro'yxati */}
            <div className="grid grid-cols-2 gap-3">
              {products.map(p => (
                <div key={p.id} className="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between">
                  <img src={p.image} alt={p.name} className="w-full h-24 object-cover rounded-lg mb-2" />
                  <div>
                    <h3 className="font-bold text-xs text-gray-800 h-7 overflow-hidden">{p.name}</h3>
                    <p className="text-emerald-700 font-extrabold text-xs mt-1">{p.price.toLocaleString()} so'm /{p.unit}</p>
                    <p className="text-amber-600 text-[10px] font-semibold">⚡ 5+ {p.unit}: {p.wholesalePrice.toLocaleString()} so'm</p>
                  </div>
                  <button 
                    onClick={() => addToCart(p)}
                    className="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold transition"
                  >
                    + Savatga
                  </button>
                </div>
              ))}
            </div>
          </main>

          {/* Pastdagi Savat Bar (agar savatda mahsulot bo'lsa) */}
          {totalItemsCount > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-2xl max-w-md mx-auto z-40 flex justify-between items-center">
              <div>
                <p className="text-xs text-gray-500">Jami ({totalItemsCount} ta):</p>
                <p className="text-sm font-bold text-emerald-700">{grandTotal.toLocaleString()} so'm</p>
              </div>
              <button 
                onClick={() => setIsCartOpen(true)}
                className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow"
              >
                Buyurtma berish 🚀
              </button>
            </div>
          )}

          {/* Savat va Buyurtma Oynasi (Modal) */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-emerald-800">🛒 Sizning Savatingiz</h3>
                  <button onClick={() => setIsCartOpen(false)} className="text-gray-400 font-bold">✕</button>
                </div>

                {cart.length === 0 ? (
                  <p className="text-center text-xs text-gray-500 py-6">Savatingiz hozircha bo'sh.</p>
                ) : (
                  <div>
                    <div className="space-y-2 mb-4 border-b pb-3">
                      {cart.map(item => {
                        const currentPrice = item.qty >= 5 ? item.wholesalePrice : item.price;
                        return (
                          <div key={item.id} className="flex justify-between items-center text-xs">
                            <div className="flex-1">
                              <p className="font-bold">{item.name}</p>
                              <p className="text-gray-500">
                                {currentPrice.toLocaleString()} so'm 
                                {item.qty >= 5 && <span className="text-amber-600 font-bold"> (Optom 🔥)</span>}
                              </p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => updateQty(item.id, -1)} className="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
                              <span className="font-bold">{item.qty} {item.unit}</span>
                              <button onClick={() => updateQty(item.id, 1)} className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">+</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Telegram Username Kirish */}
                    <div className="mb-3 bg-amber-50 p-2 rounded-lg border border-amber-200">
                      <label className="block text-[10px] font-bold text-amber-800 mb-1">Buyurtma boradigan Telegram usernameingiz:</label>
                      <input 
                        type="text" 
                        value={telegramUsername} 
                        onChange={(e) => setTelegramUsername(e.target.value)}
                        placeholder="masalan: Alisher_Meva" 
                        className="w-full border p-1.5 rounded text-xs bg-white" 
                      />
                    </div>

                    {/* Forma */}
                    <form onSubmit={sendToTelegram} className="space-y-2 text-xs">
                      <input type="text" required value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Ismingiz" className="w-full border p-2 rounded-lg" />
                      <input type="tel" required value={clientPhone} onChange={(e) => setClientPhone(e.target.value)} placeholder="Telefon raqamingiz" className="w-full border p-2 rounded-lg" />
                      <textarea required rows="2" value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} placeholder="Yetkazish manzili" className="w-full border p-2 rounded-lg"></textarea>
                      
                      <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="w-full border p-2 rounded-lg bg-white">
                        <option value="Naqd pul (Kuryerga)">Naqd pul (Kuryerga)</option>
                        <option value="Click orqali">Click orqali</option>
                        <option value="Payme orqali">Payme orqali</option>
                      </select>

                      <div className="bg-emerald-50 p-2 rounded-lg text-emerald-900 text-xs font-semibold space-y-1">
                        <div className="flex justify-between"><span>Mahsulotlar:</span><span>{goodsTotal.toLocaleString()} so'm</span></div>
                        <div className="flex justify-between"><span>Yetkazish:</span><span>{deliveryFee.toLocaleString()} so'm</span></div>
                        <div className="flex justify-between border-t pt-1 font-bold text-sm"><span>Jami:</span><span>{grandTotal.toLocaleString()} so'm</span></div>
                      </div>

                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => setIsCartOpen(false)} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl font-bold">Yopish</button>
                        <button type="submit" className="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold">Telegramga yuborish 🚀</button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
